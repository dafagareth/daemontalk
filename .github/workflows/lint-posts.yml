name: "Validate Posts & Test Suite"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: "Lint Dispatches & Run Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: "Install Dependencies & Templ CLI"
        run: |
          npm ci
          go install github.com/a-h/templ/cmd/templ@latest

      - name: "Build Assets & Check Code Integrity"
        run: make build

      - name: "Run Complete Unit Test Suite"
        run: go test -v -count=1 ./...
