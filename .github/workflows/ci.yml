name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate Templ components
        run: templ generate

      - name: Build Tailwind CSS bundle
        run: npx @tailwindcss/cli -i web/static/css/input.css -o web/static/css/main.css --minify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Verify Content Integrity
        run: ./scripts/post.sh validate

      - name: Build Server Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/daemontalk .

      - name: Build TUI Client Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/daemontalk-tui ./cmd/tui
