name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ components
        run: templ generate

      - name: Verify generated code is up to date
        run: |
          if [ -n "$(git status --porcelain '*_templ.go')" ]; then
            echo "::error::Generated *_templ.go files are out of date. Run 'templ generate' and commit."
            git diff --stat
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: CGO_ENABLED=0 go build -o daemontalk .

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t daemontalk:ci .
