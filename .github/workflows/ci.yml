name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Build Web Assets (Templ & Tailwind CSS)
        run: make assets

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Verify Content Integrity
        run: ./scripts/post.sh validate

      - name: Build Server Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/daemontalk .
