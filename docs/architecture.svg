<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .box-light { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
      .box-dashed { fill: transparent; stroke: #334155; stroke-width: 2; stroke-dasharray: 6 6; }
      .text-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #334155; text-anchor: middle; }
      .text-sm { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; fill: #475569; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; }
      .arrow { fill: #334155; }
      .bg { fill: #f8fafc; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Clients -->
  <g transform="translate(140, 40)">
    <rect width="240" height="70" class="box" />
    <text x="120" y="30" class="text-title">Web Browser</text>
    <text x="120" y="50" class="text-sub">HTML, HTMX, CSS, Feeds</text>
  </g>
  <g transform="translate(420, 40)">
    <rect width="240" height="70" class="box" />
    <text x="120" y="30" class="text-title">Terminal / cURL</text>
    <text x="120" y="50" class="text-sub">Plain-text CLI Streaming</text>
  </g>

  <!-- Ingress Line -->
  <path d="M 260 110 L 260 140 L 400 140 L 400 170" class="line" marker-end="url(#arrowhead)" />
  <path d="M 540 110 L 540 140 L 400 140" class="line" />
  <text x="460" y="155" class="text-sm">HTTP :8080</text>

  <!-- Main Web Server -->
  <g transform="translate(250, 170)">
    <rect width="300" height="90" class="box" />
    <text x="150" y="38" class="text-title">Go Chi HTTP Server</text>
    <text x="150" y="60" class="text-sub">(Routing, Auth, Security, Middlewares)</text>
  </g>

  <!-- Web to Engines -->
  <path d="M 400 260 L 400 290" class="line" />
  <path d="M 255 290 L 545 290" class="line" />
  <path d="M 255 290 L 255 330" class="line" marker-end="url(#arrowhead)" />
  <path d="M 545 290 L 545 330" class="line" marker-end="url(#arrowhead)" />

  <!-- Engines -->
  <g transform="translate(130, 330)">
    <rect width="250" height="110" class="box-light" />
    <text x="125" y="32" class="text-title">Content Engine (Disk)</text>
    <text x="125" y="54" class="text-sm">content/posts/*.md</text>
    <text x="125" y="74" class="text-sm">Goldmark Parser</text>
    <text x="125" y="94" class="text-sm">Chroma Highlighting</text>
  </g>
  <g transform="translate(420, 330)">
    <rect width="250" height="110" class="box-light" />
    <text x="125" y="32" class="text-title">SQLite Engine (WAL)</text>
    <text x="125" y="54" class="text-sm">Page Views / Hits</text>
    <text x="125" y="74" class="text-sm">Comments &amp; Socket Topics</text>
    <text x="125" y="94" class="text-sm">OAuth Users &amp; Sessions</text>
  </g>

  <!-- Engines to Templ UI -->
  <path d="M 255 440 L 255 470 L 400 470 L 400 500" class="line" marker-end="url(#arrowhead)" />
  <path d="M 545 440 L 545 470 L 400 470" class="line" />

  <!-- Templ UI -->
  <g transform="translate(250, 500)">
    <rect width="300" height="70" class="box-dashed" />
    <text x="150" y="30" class="text-title">a-h/templ Components</text>
    <text x="150" y="50" class="text-sub">SSR HTML + Tailwind CSS v4</text>
  </g>
</svg>
