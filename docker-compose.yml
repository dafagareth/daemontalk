# Production Docker Compose stack: runs the DaemonTalk web application.

services:
  web:
    image: ghcr.io/dafagareth/daemontalk:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      ENV: "${ENV:-production}"
      BASE_URL: "${BASE_URL:-https://www.daemontalk.com}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_TO:   "${SMTP_TO:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      TZ: "Asia/Jakarta"
    volumes:
      - ./data:/app/data
      - ./content:/app/content
      - ./.git:/app/.git:ro
      - ./web/static/images/posts:/app/web/static/images/posts
    restart: unless-stopped
