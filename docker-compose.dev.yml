# Development Docker Compose stack: hot-reloading with live compilation (Air, Templ, Tailwind).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "2222:2222"
    environment:
      PORT: "8080"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-in-dotenv}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_TO:   "${SMTP_TO:-}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/bin
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
